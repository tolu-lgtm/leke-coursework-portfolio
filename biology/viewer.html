<div class="bar"><span class="t" id="t">Decrypting document…</span>
<a href="#" id="dl" download>Download</a><a href="overview.html">Back to subject</a><a href="../home.html">All subjects</a></div>
<iframe id="fr" title="document"></iframe>
<script src="../crypto.js"></script>
<script>
(async ()=>{
  const p = new URLSearchParams(location.search);
  const f = (p.get("f")||"").replace(/[^a-z0-9-]/g,"");
  const key = await keyFromStore();
  if(!key || !(await tryKey(key))){ const sec=location.pathname.split("/").slice(-2,-1)[0]; location.replace("../index.html#"+sec+"/viewer.html"+location.search); return; }
  try{
    const r = await fetch("pdfs/"+f+".pdf.enc", {cache:"force-cache"});
    if(!r.ok) throw new Error("missing");
    const pt = await decryptBuf(key, await r.arrayBuffer());
    const blob = new Blob([pt], {type:"application/pdf"});
    const url = URL.createObjectURL(blob);
    document.getElementById("fr").src = url;
    const dl = document.getElementById("dl");
    dl.href = url; dl.download = f + ".pdf";
    document.getElementById("t").textContent = f + ".pdf";
  }catch(e){
    document.body.innerHTML = '<p class="msg">Could not load this document.</p>';
  }
})();
</script></body></html>
