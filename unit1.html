<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2712%27 fill=%27%231f4e8c%27/%3E%3Ctext x=%2732%27 y=%2742%27 font-size=%2728%27 font-family=%27sans-serif%27 font-weight=%27700%27 fill=%27white%27 text-anchor=%27middle%27%3ELO%3C/text%3E%3C/svg%3E">
<title>Coursework Portfolio — Private</title><style>
:root{--ink:#1a2233;--ink2:#4a566e;--mut:#8a93a6;--line:#e3e7ee;--bg:#f7f8fa;--card:#ffffff;
--acc:#1f4e8c;--acc2:#eaf1fa;--good:#1e6f43;}
*{box-sizing:border-box}body{margin:0;font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
.wrap{max-width:980px;margin:0 auto;padding:0 24px}
header.site{background:#fff;border-bottom:1px solid var(--line)}
header.site .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding-top:14px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.crest{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;
background:var(--acc);color:#fff;font-weight:700;letter-spacing:.5px}
.brand .t{font-weight:700}.brand .s{font-size:12.5px;color:var(--mut)}
header.site nav{display:flex;flex-wrap:wrap;gap:2px;width:100%;padding:6px 0 2px;border-top:1px solid var(--line)}
header.site nav a{padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--ink2);font-size:14px}
header.site nav a.on,header.site nav a:hover{background:var(--acc2);color:var(--acc)}
main{padding:28px 0 48px}
section{margin:0 0 34px}
h1{font-size:30px;line-height:1.25;margin:6px 0 10px}
h2{font-size:20px;margin:0 0 10px;padding-top:6px}
h3{font-size:16px;margin:6px 0}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--acc)}
.lede{font-size:17px;color:var(--ink2);max-width:70ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.tile .v{font-size:28px;font-weight:700;letter-spacing:-.01em}
.tile .l{font-size:13.5px;color:var(--ink2);margin-top:2px}
.tile .sub{font-size:12px;color:var(--mut);margin-top:4px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14.5px}
tr:last-child td{border-bottom:none}
th{background:#f0f3f8;font-size:13px;letter-spacing:.02em;color:var(--ink2)}
td.num{white-space:nowrap}td.slot{color:var(--mut);white-space:nowrap}
table.mini th{width:220px;background:#f0f3f8}
.pill{display:inline-block;background:#e8f3ec;color:var(--good);font-weight:600;font-size:13px;padding:2px 9px;border-radius:999px}
.pill.big{font-size:15px;padding:4px 12px}
.kind{display:inline-block;background:var(--acc2);color:var(--acc);font-weight:600;font-size:12px;padding:2px 9px;border-radius:999px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card .ct{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
.card.exam{border-left:4px solid var(--acc)}
.card.muted{opacity:.75}
a.pdf{display:inline-block;margin-top:8px;font-size:14px;color:var(--acc);text-decoration:none;font-weight:600}
a.pdf::before{content:"\1F4C4  "}
a.pdf:hover{text-decoration:underline}
.note{font-size:13.5px;color:var(--mut)}
.statement{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;padding:18px 22px}
.sig{color:var(--ink2);font-style:italic}
nav.pager{display:flex;justify-content:space-between;margin-top:8px}
nav.pager a{color:var(--acc);text-decoration:none;font-weight:600}
footer.site{border-top:1px solid var(--line);background:#fff}
footer.site p{font-size:12.5px;color:var(--mut);padding:16px 0}
ul{padding-left:20px}li{margin:6px 0}
@media print{header.site nav,nav.pager{display:none}}

#lock{max-width:420px;margin:120px auto;text-align:center;padding:0 20px;display:none}
</style></head><body data-page="unit1">
<div id="app"></div>
<div id="lock"><p>This portfolio is private. Redirecting to the sign-in page&hellip;</p></div>
<script src="crypto.js"></script>
<script>portfolioBoot();</script>
</body></html>
